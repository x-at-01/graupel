name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Uses the rustup the runner already ships with instead of a toolchain action. Every external
# action is another chance for GitHub to fail resolving it, which shows up as a red badge that
# has nothing to do with the code.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: build without std
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build --no-default-features --target thumbv7em-none-eabihf
      - name: build on the minimum supported Rust version
        run: |
          rustup toolchain install 1.74.0 --profile minimal --no-self-update
          cargo +1.74.0 build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The benchmark asserts a lossless round trip per series, so this is a correctness gate.
      - run: ./scripts/fetch-data.sh
      - run: cargo run --release --bin graupel-bench
