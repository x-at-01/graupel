[package]
name = "graupel"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Lossless time series compression: Gorilla, Chimp, Chimp128, Elf and decimal scaling, measured on real observation archives"
repository = "https://github.com/jocarrd/graupel"
readme = "README.md"
keywords = ["time-series", "compression", "gorilla", "chimp", "tsdb"]
documentation = "https://docs.rs/graupel"
categories = ["compression", "database-implementations", "science"]
exclude = ["data/"]

[dependencies]
fastalp = "0.1.24"

# Only the external-comparison example needs these; the library itself has no dependencies.
[dev-dependencies]
tsz = "0.1"

[features]
default = ["std"]
# The codecs need only `alloc`; `std` adds the error trait and the benchmark binary.
std = []

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "graupel-bench"
path = "src/bin/bench.rs"
required-features = ["std"]
